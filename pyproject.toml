[project]
name = "chowlite"
version = "0.1.0"
description = "Router-first, evidence-gated agent operating system on Google ADK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "google-adk>=2.0.0",
    "google-genai>=1.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-cloud-firestore>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
chow = "chowlite.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chowlite*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP", "PLW", "BLE", "EXE"]
ignore = ["E501"]
